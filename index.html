<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirection...</title>
  <script>
    const host = window.location.hostname;
    const redirects = {
      "etoualink.epc.cm": "https://sites.google.com/site/etoualink",
      "mbankomo.epc.cm": "https://x.com/epcmbankomo",
      "partenaire2.epc.cm": "https://wordpress.com/partenaire2"
      // Ajoute ici : "nouveau.epc.cm": "https://url-du-site.com",
    };
    const targetBase = redirects[host];
    if (targetBase) {
      window.location.href = targetBase + window.location.pathname + window.location.search;
    } else {
      document.body.innerHTML = "<h1>Redirections EPC</h1><p>Ce site gère les redirections vers les partenaires. Si vous voyez cette page, le sous-domaine n'est pas configuré.</p>";
    }
  </script>
</head>
<body>
  <p>Redirection en cours...</p>
</body>
</html>
